[project]
name = "hass-promql"
version = "0.1.0"
description = "PromQL sensor integration for Home Assistant"
license = { text = "MIT" }
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-homeassistant-custom-component",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.14"
strict = true
