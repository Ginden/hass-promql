services:
  # One-shot init: seeds dev/ha-config/ from dev/ha-seed/ on first run.
  init:
    image: busybox
    volumes:
      - ./dev/ha-seed:/ha-seed:ro
      - ./dev/ha-config:/ha-config
      - ./scripts/init-ha.sh:/init-ha.sh:ro
    command: sh /init-ha.sh

  homeassistant:
    build: .
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - ./dev/ha-config:/config
      - ./custom_components:/config/custom_components:ro
    ports:
      - "8123:8123"
    restart: unless-stopped
    environment:
      TZ: UTC

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./dev/prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    restart: unless-stopped
